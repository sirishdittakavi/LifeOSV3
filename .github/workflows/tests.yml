name: LifeOS Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Unit and component tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic core suite
        run: swift test --disable-sandbox

  ios-test-build:
    name: Compile iOS app and XCTest bundles
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and both test targets
        run: >-
          xcodebuild build-for-testing
          -project LifeOS.xcodeproj
          -scheme LifeOS
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/LifeOSDerivedData"
          CODE_SIGNING_ALLOWED=NO
