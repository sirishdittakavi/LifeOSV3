name: LifeOS

options:
  bundleIdPrefix: com.sirishdittakavi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirishdittakavi.lifeos
        PRODUCT_NAME: LifeOS
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LifeOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan food barcodes and photograph nutrition labels.

schemes:
  LifeOS:
    build:
      targets:
        LifeOS: all
    run:
      config: Debug
