name: LifeOS

options:
  bundleIdPrefix: com.sirishdittakavi
  xcodeVersion: "26.6"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirishdittakavi.lifeos
        PRODUCT_NAME: LifeOS
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LifeOS
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  LifeOSUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LifeOSUnitTests
    dependencies:
      - target: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirishdittakavi.lifeos.unit-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0

  LifeOSComponentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LifeOSComponentTests
    dependencies:
      - target: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirishdittakavi.lifeos.component-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0

schemes:
  LifeOS:
    build:
      targets:
        LifeOS: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LifeOSUnitTests
        - LifeOSComponentTests
